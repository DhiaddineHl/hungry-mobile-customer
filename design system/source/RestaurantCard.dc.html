<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;font-family:Montserrat,sans-serif;color:#003049;width:100%">
<div style="position:relative;height:172px;border-radius:20px;overflow:hidden;background:#EFEDEA">
<img src="{{ image }}" alt="{{ title }}" style="width:100%;height:100%;object-fit:cover;display:block">
<sc-if value="{{ hasPromo }}"><span style="position:absolute;left:12px;bottom:12px;height:30px;border-radius:15px;background:#003049;color:#FFFFFF;padding:0 12px;display:flex;align-items:center;font-weight:600;font-size:13px;white-space:nowrap">{{ promo }}</span></sc-if>
<span style="position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><img src="./assets/lucide/heart-navy.svg" alt="" style="width:18px;height:18px;object-fit:contain;display:block;opacity:1"></span>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:18px;line-height:24px;font-weight:700;letter-spacing:-0.2px">{{ title }}</span>
<span style="font-size:13px;line-height:18px;color:#5B6B75">{{ cuisine }}</span>
</div>
<div style="display:flex;align-items:center;gap:16px;font-size:13px;line-height:18px;flex-wrap:nowrap">
<span style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:#003049;font-weight:600"><span style="width:28px;height:28px;flex-shrink:0;border-radius:14px;background:#FCE9D2;display:flex;align-items:center;justify-content:center"><img src="./assets/lucide/thumbs-up-navy.svg" alt="" style="width:14px;height:14px;display:block"></span>{{ liked }}</span>
<span style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:#003049;font-weight:500"><span style="width:28px;height:28px;flex-shrink:0;border-radius:14px;background:#EEF0F1;display:flex;align-items:center;justify-content:center"><img src="./assets/lucide/clock-navy.svg" alt="" style="width:13px;height:13px;display:block"></span>{{ time }}</span>
<sc-if value="{{ free }}"><span style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:#2E7A3D;font-weight:600"><span style="width:28px;height:28px;flex-shrink:0;border-radius:14px;background:rgba(58,151,76,0.14);display:flex;align-items:center;justify-content:center"><img src="./assets/lucide/motorbike-green.svg" alt="" style="width:17px;height:17px;display:block"></span>Free delivery</span></sc-if>
<sc-if value="{{ paid }}"><span style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:#003049;font-weight:500"><span style="width:28px;height:28px;flex-shrink:0;border-radius:14px;background:#EEF0F1;display:flex;align-items:center;justify-content:center"><img src="./assets/lucide/motorbike-navy.svg" alt="" style="width:17px;height:17px;display:block"></span>{{ fee }}</span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:342,&quot;height&quot;:260},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/home/tacoth-banner.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tacoth&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cuisine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;French tacos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;liked&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;92%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30–45 min&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fee&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;promo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Up to 20% off&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { image: p.image ?? '', title: p.title ?? 'Restaurant', cuisine: p.cuisine ?? '', liked: p.liked ?? '90%', time: p.time ?? '30–45 min', fee: p.fee ?? '', free: !p.fee, paid: !!p.fee, promo: p.promo ?? '', hasPromo: !!p.promo };
  }
}
</script>
</body>
</html>
