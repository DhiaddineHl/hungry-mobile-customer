<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:14px;font-family:Montserrat,sans-serif;color:#003049;padding:10px 0">
<div style="width:64px;height:64px;flex-shrink:0;border-radius:16px;overflow:hidden;background:#F2F1EE;border:1px solid #EEF0F1;box-sizing:border-box"><img src="{{ image }}" alt="{{ title }}" style="width:100%;height:100%;object-fit:{{ fit }};display:block"></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;line-height:22px;font-weight:700">{{ title }}</span>
<span style="font-size:13px;line-height:18px;color:#5B6B75">{{ cuisine }}</span>
<span style="font-size:13px;line-height:18px;color:#5B6B75"><span style="color:#003049;font-weight:600">{{ liked }}</span> · {{ time }} · {{ feeText }}</span>
</div>
</div></sc-if>
<sc-if value="{{ closed }}"><div style="display:flex;align-items:center;gap:14px;font-family:Montserrat,sans-serif;color:#003049;padding:10px 0">
<div style="width:64px;height:64px;flex-shrink:0;border-radius:16px;overflow:hidden;background:#F2F1EE;border:1px solid #EEF0F1;box-sizing:border-box;opacity:0.45;filter:grayscale(1)"><img src="{{ image }}" alt="{{ title }}" style="width:100%;height:100%;object-fit:{{ fit }};display:block"></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;line-height:22px;font-weight:700;color:#5B6B75">{{ title }}</span>
<span style="font-size:13px;line-height:18px;color:#5B6B75">{{ cuisine }}</span>
<span style="align-self:flex-start;margin-top:2px;font-size:12px;line-height:16px;font-weight:600;color:#003049;background:#F2F1EE;border-radius:6px;padding:3px 8px">Closed · {{ opens }}</span>
</div>
</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:342,&quot;height&quot;:84},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/home/logo-b.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;contain&quot;],&quot;default&quot;:&quot;cover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Taxi Pizza Khzema&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cuisine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pizza · Sandwiches&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;liked&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;94%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;25–40 min&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fee&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;opens&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { image: p.image ?? '', fit: p.fit ?? 'cover', title: p.title ?? 'Restaurant', cuisine: p.cuisine ?? '', liked: p.liked ?? '90%', time: p.time ?? '30–45 min', feeText: p.fee ? p.fee + ' delivery' : 'Free delivery', open: !p.opens, closed: !!p.opens, opens: p.opens ?? '' };
  }
}
</script>
</body>
</html>
